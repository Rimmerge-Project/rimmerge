# cargo-deny configuration. Verified locally with `cargo deny check`
# (`cargo install cargo-deny --locked`) — passes clean; CI runs it via
# `EmbarkStudios/cargo-deny-action` (see `.github/workflows/ci.yml`).

[graph]
all-features = false
# This app ships on Windows only (RimWorld/RimSort are Windows-first, and
# `rim-io` links `sysinfo`'s Windows process APIs) — restricting the
# graph to the one target we actually build for prunes an entire branch
# of Tauri's dependency tree that's Windows-irrelevant: `wry`'s Linux
# webview backend (`webkit2gtk`, `gtk`, the `unic-*` crates, `dom_query`/
# `cssparser`) pulls in several `RUSTSEC` "unmaintained" advisories and an
# MPL-2.0 license that this build never actually compiles. Without this,
# `cargo deny check` would fail on advisories/licenses this project has
# no way to act on (they're not our dependencies to update).
targets = ["x86_64-pc-windows-msvc"]

[advisories]
# Explicit policy: a yanked crate version or a RUSTSEC advisory (security
# or unmaintained) anywhere in the *Windows* dependency graph fails the
# check. Nothing is ignored — if `[graph].targets` above ever widens back
# to include a non-Windows target, expect this to need real entries here
# (or a narrower `[graph].exclude`) rather than silently passing.
yanked = "deny"
ignore = [
    # The `unic-*` Unicode crate family (all of
    # https://github.com/open-i18n/rust-unic) is unmaintained — pulled in
    # transitively via `urlpattern` (a Tauri-wide dependency, not
    # Windows-specific, so `[graph].targets` above doesn't prune it) ->
    # `tauri-utils` -> `tauri`. Not our dependency to replace or upgrade;
    # revisit when Tauri itself moves off `urlpattern`'s `unic-*` usage.
    { id = "RUSTSEC-2025-0075", reason = "unic-char-property, transitive via tauri-utils -> urlpattern; not directly depended on" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common, transitive via tauri-utils -> urlpattern; not directly depended on" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-range, transitive via tauri-utils -> urlpattern; not directly depended on" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version, transitive via tauri-utils -> urlpattern; not directly depended on" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident, transitive via tauri-utils -> urlpattern; not directly depended on" },
]

[bans]
multiple-versions = "warn"
# `true` for genuinely unpinned external deps; the workspace's own
# `rim-*` crates are `path` dependencies that also carry an explicit
# `version` (root `Cargo.toml`'s `[workspace.dependencies]`) precisely so
# they don't need an exemption here.
wildcards = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0", # option-ext, pulled in via `dirs` (Tauri's config-dir resolution) — copyleft but this project never modifies or redistributes it as source, and MPL-2.0 is file-scoped copyleft (unlike GPL/LGPL), so linking against it imposes no obligation on rimmerge's own code.
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
