name: Release

# Windows and Ubuntu builds; pin the oldest supported Linux packaging baseline.
# Windows builds produce portable zips via scripts/package-portable.ps1
# (the Tauri bundler is off there — bundle.active: false keeps the exe
# alone, matching what package-portable.ps1 expects). Linux builds
# activate the bundler for the deb target via
# tauri.linux.conf.json, then produce portable tarballs via
# scripts/package-linux.ps1. The two jobs upload to separate artifact
# names so the release job can download them all at once.
#
# Portable, not an installer (Windows): `bundle.active` is false in
# tauri.conf.json, so `tauri build` emits only the exe and
# scripts/package-portable.ps1 zips it with the CLI and the licenses.
# Data lives in %LOCALAPPDATA%\rimmerge on Windows; XDG/HOME on Linux.
#
# No code signing. This project has no signing certificate or secrets,
# so the zips and tarballs below ship unsigned. A SHA256SUMS.txt is
# attached to the release instead. See docs/install.md.
#
# Draft only: the final job creates a **draft** GitHub Release with the
# artifacts attached. A human reviews and publishes it — this workflow
# never publishes on its own.
#
# `submodules: true` on every checkout: the build embeds
# `rules/rimmerge-rules.json` from the `rimmerge-rules` git submodule
# (crates/rim-io/build.rs) and fails without it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege by default; the one job that needs to create a release
# grants itself `contents: write` on top of this.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version-check:
    name: Version consistency
    runs-on: ubuntu-24.04
    outputs:
      # The already-validated version, not `github.ref_name` — a
      # `workflow_dispatch` run's ref is a branch name (may contain `/`,
      # unsafe in a filename) rather than a version, so the build jobs
      # below name their artifacts from this instead of re-deriving
      # anything from the ref itself.
      version: ${{ steps.check-versions.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # On an actual tag push this requires the tag to equal every
      # version source (Cargo.tomls, tauri.conf.json, package.json —
      # see scripts/check-versions.ps1's own header). On a manual
      # workflow_dispatch run (no tag involved) it still checks that
      # every source agrees with every other one, just not against a
      # tag that doesn't exist for this run.
      - name: check-versions
        id: check-versions
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            ./scripts/check-versions.ps1 -Tag $env:GITHUB_REF_NAME
          } else {
            ./scripts/check-versions.ps1
          }

  build:
    name: Build (${{ matrix.os }})
    needs: version-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Linux system dependencies (WebKitGTK, GTK, build tools)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev wget

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: oven-sh/setup-bun@v2
        with:
          # Same pin as ci.yml's bun job — see that workflow's own
          # comment on why `latest` isn't used.
          bun-version: 1.4.0

      - name: bun install
        run: bun install --frozen-lockfile

      - name: Linux packaging regressions (synthetic files only)
        if: runner.os == 'Linux'
        shell: pwsh
        run: ../../scripts/tests/package-linux.Tests.ps1

      # Build the CLI before Tauri: the Linux .deb includes it.
      # Built once per platform. On Windows: rimmerge.exe.
      # On Linux: rimmerge (ELF, no extension).
      # `--jobs 4` avoids OOM on memory-constrained build hosts; a
      # release build (lto = "thin", codegen-units = 1 — see Cargo.toml)
      # is the single heaviest build this repo does.
      - name: cargo build --release -p rimmerge-cli
        run: cargo build --release -p rimmerge-cli --jobs 4

      # Runs `beforeBuildCommand` (`bun run build`) itself, so no
      # separate frontend build step is needed here.
      # On Windows, bundle.active is false, producing only the exe.
      # On Linux, tauri.linux.conf.json activates bundling for deb —
      # Tauri v2 auto-merges platform-specific
      # overlay configs (tauri.<os>.conf.json) before building.
      - name: bun run tauri build (Windows — exe only, no installer)
        if: runner.os == 'Windows'
        run: bun run tauri build

      - name: bun run tauri build (Linux — deb bundle)
        if: runner.os == 'Linux'
        run: bun run tauri build

      - name: Verify Linux bundle contents (Ubuntu)
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          repo="$GITHUB_WORKSPACE"
          deb="$repo/target/release/bundle/deb/Rimmerge_${VERSION}_amd64.deb"
          test "$(dpkg-deb -f "$deb" Version)" = "$VERSION"
          test "$(dpkg-deb -f "$deb" Architecture)" = amd64
          dpkg-deb -x "$deb" "$scratch/deb"
          test -x "$scratch/deb/usr/bin/rimmerge"
          test -x "$scratch/deb/usr/bin/rimmerge-desktop"
          cmp "$repo/target/release/rimmerge" "$scratch/deb/usr/bin/rimmerge"
          test -f "$scratch/deb/usr/share/applications/Rimmerge.desktop"
          for license in LICENSE-MIT LICENSE-APACHE; do
            cmp "$repo/$license" "$scratch/deb/usr/share/doc/rimmerge/$license"
          done
      # Windows only: package-portable.ps1 produces the portable zip and
      # the CLI-only zip. Working directory is apps/desktop here, so the
      # script and the output folder are reached with ../../.
      - name: package-portable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: ../../scripts/package-portable.ps1 -Version $env:VERSION -OutDir ../../portable

      # Linux only: package-linux.ps1 produces portable desktop/CLI tarballs
      # and copies the Tauri-generated deb.
      - name: package-linux (Linux)
        if: runner.os == 'Linux'
        shell: pwsh
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: ../../scripts/package-linux.ps1 -Version $env:VERSION -OutDir ../../portable

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: zips-windows
          path: |
            portable/Rimmerge-${{ needs.version-check.outputs.version }}-windows-x64-portable.zip
            portable/rimmerge-cli-${{ needs.version-check.outputs.version }}-x86_64-pc-windows-msvc.zip
          # Fail loudly if the glob matched nothing — a build that
          # silently produced no zip must not upload an empty artifact
          # and let the release job fail later with a far less obvious
          # error.
          if-no-files-found: error

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: zips-linux
          path: |
            portable/Rimmerge-${{ needs.version-check.outputs.version }}-linux-x64-portable.tar.gz
            portable/rimmerge-cli-${{ needs.version-check.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz
            portable/Rimmerge_${{ needs.version-check.outputs.version }}_amd64.deb
          if-no-files-found: error

  collect:
    name: Validate artifacts and checksums
    needs: [version-check, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4

      # One checksum file for every artifact across all platforms, with
      # bare file names so `sha256sum -c SHA256SUMS.txt` works from the
      # download folder without path prefixes.
      - name: Collect all five artifacts and write SHA256SUMS
        shell: pwsh
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: ./scripts/collect-release-artifacts.ps1 -Version $env:VERSION -ArtifactDir . -OutDir release-files

      - name: Verify SHA256SUMS
        working-directory: release-files
        run: sha256sum -c SHA256SUMS.txt

      - name: Upload packages and checksums
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release-files/*
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    needs: collect
    # Manual runs validate and upload packages, even when selecting a tag.
    # Only a tag push creates a draft release.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-files

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release-files/*
