name: Release

# Windows runners for the build jobs, matching ci.yml's own reasoning:
# the CLI targets Windows only and the desktop app is a Tauri build
# that needs WebView2/MSVC — there is no other platform to build for.
# `submodules: true` on every checkout: the build embeds
# `rules/rimmerge-rules.json` from the `rimmerge-rules` git submodule
# (crates/rim-io/build.rs) and fails without it, even for the
# version-check job, which reads the same working tree.
#
# Portable, not an installer: `bundle.active` is false in
# tauri.conf.json, so `tauri build` emits only the exe and
# scripts/package-portable.ps1 zips it with the CLI and the licenses.
# Data lives in %LOCALAPPDATA%\rimmerge (plus the WebView profile in
# %LOCALAPPDATA%\dev.rimmerge.app), never beside the exe.
#
# No code signing. This project has no signing certificate or secrets,
# so the zips below ship unsigned — Windows SmartScreen will warn on
# first run. A SHA256SUMS.txt is attached to the release instead. See
# docs/install.md.
#
# Draft only: the final job creates a **draft** GitHub Release with the
# artifacts attached. A human reviews and publishes it — this workflow
# never publishes on its own.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege by default; the one job that needs to create a release
# grants itself `contents: write` on top of this.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version-check:
    name: Version consistency
    runs-on: windows-latest
    outputs:
      # The already-validated version, not `github.ref_name` — a
      # `workflow_dispatch` run's ref is a branch name (may contain `/`,
      # unsafe in a Windows filename) rather than a version, so the
      # `desktop` job below names its zips from this instead of
      # re-deriving anything from the ref itself.
      version: ${{ steps.check-versions.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # On an actual tag push this requires the tag to equal every
      # version source (Cargo.tomls, tauri.conf.json, package.json —
      # see scripts/check-versions.ps1's own header). On a manual
      # workflow_dispatch run (no tag involved) it still checks that
      # every source agrees with every other one, just not against a
      # tag that doesn't exist for this run.
      - name: check-versions
        id: check-versions
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            ./scripts/check-versions.ps1 -Tag $env:GITHUB_REF_NAME
          } else {
            ./scripts/check-versions.ps1
          }

  desktop:
    name: Build desktop
    needs: version-check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: oven-sh/setup-bun@v2
        with:
          # Same pin as ci.yml's bun job — see that workflow's own
          # comment on why `latest` isn't used.
          bun-version: 1.4.0

      - name: bun install
        run: bun install --frozen-lockfile

      # Runs `beforeBuildCommand` (`bun run build`) itself, so no
      # separate frontend build step is needed here. Bundling is off
      # (`bundle.active: false`), so this only produces
      # target/release/rimmerge-desktop.exe with the frontend embedded.
      - name: bun run tauri build
        run: bun run tauri build

      # Built once, here: the portable zip and the CLI-only zip both
      # package this one rimmerge.exe. `--jobs 4` matches how this
      # workspace is built everywhere else, to avoid OOMing a
      # memory-constrained build host; a release build (`lto = "thin"`,
      # `codegen-units = 1` — see Cargo.toml) is the single heaviest
      # build this repo does.
      - name: cargo build --release -p rimmerge-cli
        run: cargo build --release -p rimmerge-cli --jobs 4

      # Working directory is apps/desktop here, so the script and the
      # output folder are reached with `../../`; the binaries come from
      # the script's own default (the workspace-root `target/release`).
      # Writes the portable zip and the CLI-only zip.
      - name: package-portable
        shell: pwsh
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: ../../scripts/package-portable.ps1 -Version $env:VERSION -OutDir ../../portable

      - uses: actions/upload-artifact@v4
        with:
          name: zips
          # Paths are relative to the checkout root, not this job's
          # `apps/desktop` `defaults.run.working-directory` (that
          # default only applies to `run:` steps), hence `portable/` at
          # the root, where the package step wrote it.
          path: |
            portable/*.zip
          # A build that silently produced no zip (a broken glob, a
          # build that succeeded without emitting the binary) must fail
          # this step loudly, not upload an empty artifact and let the
          # release job fail later with a far less obvious error.
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    needs: desktop
    # Only an actual tag push creates a release — a `workflow_dispatch`
    # run (used to dry-run the build pipeline itself, e.g. to confirm
    # the packaging above) builds the zips but stops there;
    # `needs: desktop` still gates this job on that build succeeding.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      # Only this job writes to the repo (creating the draft release);
      # every other job keeps the top-level `contents: read` default.
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      # One checksum file for every zip, with bare file names so
      # `sha256sum -c SHA256SUMS.txt` works from the download folder.
      - name: SHA256SUMS
        run: |
          mkdir release-files
          cp zips/*.zip release-files/
          cd release-files
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release-files/*
