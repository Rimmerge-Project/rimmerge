[package]
name = "rim-resolve"
version = "1.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Pure domain: rules, tags, and the resolution ledger for Rimmerge"

[lib]
name = "rim_resolve"
path = "src/lib.rs"

[[example]]
name = "trim_fixture"
path = "examples/trim_fixture.rs"

[[example]]
name = "anonymize_report"
path = "examples/anonymize_report.rs"

[[example]]
name = "sort_equivalence"
path = "examples/sort_equivalence.rs"

[lints]
workspace = true

[features]
# Exposes `test_support` (a `ReportBuilder` for hand-made mini reports) so
# both this crate's unit tests and its `tests/` integration tests can share
# one implementation. Never enabled in a non-dev build.
test-support = []

[dependencies]
rim-analyzer = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
jiff = { workspace = true }
petgraph = { workspace = true }
fixedbitset = { workspace = true }

[dev-dependencies]
rim-resolve = { path = ".", features = ["test-support"] }
proptest = { workspace = true }
pretty_assertions = { workspace = true }
insta = { workspace = true }
