# Applies to any workspace member that doesn't shadow this with its own
# clippy.toml (rim-analyzer keeps its own, unchanged). `unwrap`/`expect`
# are denied crate-wide by `[workspace.lints.clippy]` except in test code,
# where they're the normal way to fail a test fast.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
